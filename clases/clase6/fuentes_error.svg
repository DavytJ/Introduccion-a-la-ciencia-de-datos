<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6faf8"/><stop offset="1" stop-color="#ecf5f1"/></linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b7a5e"/><stop offset="1" stop-color="#0f4c3a"/></linearGradient>
    <linearGradient id="nar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd6c4"/><stop offset="1" stop-color="#1fa59a"/></linearGradient>
    <linearGradient id="gris" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6aa79a"/><stop offset="1" stop-color="#3f7a6c"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f4c3a" flood-opacity="0.16"/></filter>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1fa59a"/></marker>
    <marker id="arrb" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#0f4c3a"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <!-- embudo de 5 niveles -->
  <g filter="url(#sh)">
    <path d="M100,60 h860 l-60,70 h-740 z" fill="#0f4c3a"/>
    <path d="M170,150 h720 l-60,70 h-600 z" fill="#1f8a6a"/>
    <path d="M240,240 h580 l-60,70 h-460 z" fill="#3aa88a"/>
    <path d="M310,330 h440 l-60,70 h-320 z" fill="#6aa79a"/>
    <path d="M380,420 h300 v70 h-300 z" fill="url(#nar)"/>
  </g>
  <g font-size="21" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="530" y="104">Población</text>
    <text x="530" y="194">Marco muestral</text>
    <text x="530" y="284">Muestra</text>
    <text x="530" y="374">Respondentes</text>
    <text x="530" y="463">Dato registrado</text>
  </g>
  <!-- etiquetas de error -->
  <g font-size="17" fill="#0f4c3a">
    <g transform="translate(915,130)"><line x1="0" y1="0" x2="40" y2="0" stroke="#1fa59a" stroke-width="3"/><text x="50" y="6" font-weight="700" fill="#1fa59a">Cobertura</text><text x="50" y="28" fill="#556" font-size="14">quién no está en la lista</text></g>
    <g transform="translate(845,220)"><line x1="0" y1="0" x2="40" y2="0" stroke="#1fa59a" stroke-width="3"/><text x="50" y="6" font-weight="700" fill="#1fa59a">Muestreo</text><text x="50" y="28" fill="#556" font-size="14">se observa una parte</text></g>
    <g transform="translate(775,310)"><line x1="0" y1="0" x2="40" y2="0" stroke="#1fa59a" stroke-width="3"/><text x="50" y="6" font-weight="700" fill="#1fa59a">No respuesta</text><text x="50" y="28" fill="#556" font-size="14">no contesta, o deja en blanco</text></g>
    <g transform="translate(705,400)"><line x1="0" y1="0" x2="40" y2="0" stroke="#1fa59a" stroke-width="3"/><text x="50" y="6" font-weight="700" fill="#1fa59a">Medición</text><text x="50" y="28" fill="#556" font-size="14">la respuesta no es el valor real</text></g>
  </g>
  <!-- marca de alcance -->
  <rect x="40" y="330" width="240" height="160" rx="14" fill="#fff" filter="url(#sh)"/>
  <text x="160" y="365" text-anchor="middle" font-size="15" font-weight="700" fill="#0f4c3a">Esta clase</text>
  <text x="160" y="395" text-anchor="middle" font-size="14" fill="#333">trabaja sobre las</text>
  <text x="160" y="416" text-anchor="middle" font-size="14" fill="#333">dos últimas fuentes:</text>
  <text x="160" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#1fa59a">no respuesta</text>
  <text x="160" y="470" text-anchor="middle" font-size="15" font-weight="700" fill="#1fa59a">medición</text>
  <text x="530" y="530" text-anchor="middle" font-size="14" fill="#778">Marco de error total de encuesta (Groves et al., 2009)</text>
</svg>
