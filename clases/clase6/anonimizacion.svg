<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6faf8"/><stop offset="1" stop-color="#ecf5f1"/></linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b7a5e"/><stop offset="1" stop-color="#0f4c3a"/></linearGradient>
    <linearGradient id="nar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd6c4"/><stop offset="1" stop-color="#1fa59a"/></linearGradient>
    <linearGradient id="gris" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6aa79a"/><stop offset="1" stop-color="#3f7a6c"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f4c3a" flood-opacity="0.16"/></filter>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1fa59a"/></marker>
    <marker id="arrb" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#0f4c3a"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <!-- tabla con nombre -->
  <g transform="translate(60,70)">
    <text x="0" y="-20" font-size="18" font-weight="700" fill="#0f4c3a">Con identificadores</text>
    <rect x="0" y="0" width="480" height="200" rx="14" fill="#fff" filter="url(#sh)"/>
    <path d="M0,14 a14,14 0 0 1 14,-14 h452 a14,14 0 0 1 14,14 v36 h-480 z" fill="url(#azul)"/>
    <g fill="#fff" font-family="Courier New, monospace" font-size="14" font-weight="700">
      <text x="16" y="32">nombre</text><text x="150" y="32">cedula</text><text x="270" y="32">anio</text><text x="340" y="32">alquiler</text>
    </g>
    <g font-family="Courier New, monospace" font-size="14" fill="#333">
      <text x="16" y="85">M. Pérez</text><text x="150" y="85">4.812.…</text><text x="270" y="85">2</text><text x="340" y="85">NA</text>
      <text x="16" y="130">J. Silva</text><text x="150" y="130">5.204.…</text><text x="270" y="130">4</text><text x="340" y="130">12000</text>
      <text x="16" y="175">A. Rocha</text><text x="150" y="175">5.531.…</text><text x="270" y="175">3</text><text x="340" y="175">9000</text>
    </g>
    <rect x="8" y="58" width="245" height="132" rx="8" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="8,5"/>
  </g>
  <!-- flecha -->
  <line x1="560" y1="170" x2="640" y2="170" stroke="#1fa59a" stroke-width="5" stroke-linecap="round" marker-end="url(#arr)"/>
  <text x="600" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1fa59a">borrar</text>
  <!-- tabla sin nombre -->
  <g transform="translate(660,70)">
    <text x="0" y="-20" font-size="18" font-weight="700" fill="#0f4c3a">Sin identificadores… ¿anónima?</text>
    <rect x="0" y="0" width="480" height="200" rx="14" fill="#fff" filter="url(#sh)"/>
    <path d="M0,14 a14,14 0 0 1 14,-14 h452 a14,14 0 0 1 14,14 v36 h-480 z" fill="url(#azul)"/>
    <g fill="#fff" font-family="Courier New, monospace" font-size="14" font-weight="700">
      <text x="16" y="32">id</text><text x="70" y="32">anio</text><text x="150" y="32">alquiler</text><text x="290" y="32">fuente_otro</text>
    </g>
    <g font-family="Courier New, monospace" font-size="14" fill="#333">
      <text x="16" y="85">1</text><text x="70" y="85">2</text><text x="150" y="85">NA</text><text x="290" y="85">NA</text>
      <text x="16" y="130">2</text><text x="70" y="130">4</text><text x="150" y="130">12000</text><text x="290" y="130">NA</text>
      <text x="16" y="175" fill="#1fa59a" font-weight="700">3</text><text x="70" y="175" fill="#1fa59a" font-weight="700">3</text><text x="150" y="175" fill="#1fa59a" font-weight="700">9000</text><text x="290" y="175" fill="#1fa59a" font-weight="700">freelance</text>
    </g>
    <rect x="8" y="150" width="464" height="40" rx="8" fill="none" stroke="#1fa59a" stroke-width="3"/>
  </g>
  <!-- explicación -->
  <rect x="60" y="320" width="1080" height="110" rx="18" fill="#fff" filter="url(#sh)"/>
  <rect x="60" y="320" width="12" height="110" rx="6" fill="#1fa59a"/>
  <text x="100" y="360" font-size="17" fill="#333">En una facultad chica, «tercer año, paga 9.000 de alquiler, hace trabajos freelance» identifica a una persona.</text>
  <text x="100" y="392" font-size="17" fill="#333">Combinar columnas inocuas puede reidentificar. Anonimizar es más que borrar una columna.</text>
  <rect x="330" y="470" width="540" height="52" rx="26" fill="#0f4c3a"/>
  <text x="600" y="503" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Datos de contacto: en otra tabla, unida por id</text>
</svg>
