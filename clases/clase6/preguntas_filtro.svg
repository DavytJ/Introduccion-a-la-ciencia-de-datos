<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f4c3a"/></marker></defs>
  <!-- P2 -->
  <rect x="30" y="110" width="230" height="90" rx="8" fill="#ecf5f1" stroke="#0f4c3a" stroke-width="3"/>
  <text x="145" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f4c3a">P2</text>
  <text x="145" y="165" text-anchor="middle" font-size="14" fill="#333">¿Vive en la casa</text>
  <text x="145" y="185" text-anchor="middle" font-size="14" fill="#333">familiar?</text>
  <!-- flechas -->
  <path d="M260,140 C330,140 330,70 400,70" fill="none" stroke="#0f4c3a" stroke-width="3" marker-end="url(#a)"/>
  <path d="M260,170 C330,170 330,250 400,250" fill="none" stroke="#0f4c3a" stroke-width="3" marker-end="url(#a)"/>
  <text x="315" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#1fa59a">Sí</text>
  <text x="315" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#1fa59a">No</text>
  <!-- salto -->
  <rect x="405" y="35" width="200" height="70" rx="8" fill="#fff" stroke="#999" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="505" y="62" text-anchor="middle" font-size="14" fill="#666">salta P3</text>
  <text x="505" y="85" text-anchor="middle" font-size="14" fill="#666">→ sigue en P4</text>
  <!-- P3 -->
  <rect x="405" y="210" width="200" height="80" rx="8" fill="#ecf5f1" stroke="#0f4c3a" stroke-width="3"/>
  <text x="505" y="237" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f4c3a">P3</text>
  <text x="505" y="262" text-anchor="middle" font-size="14" fill="#333">¿Cuánto paga</text>
  <text x="505" y="281" text-anchor="middle" font-size="14" fill="#333">de alquiler?</text>
  <!-- tabla resultante -->
  <g transform="translate(660,60)">
    <rect x="0" y="0" width="215" height="36" fill="#0f4c3a"/>
    <g fill="#fff" font-family="Courier New, monospace" font-size="13" font-weight="bold">
      <text x="12" y="24">id</text><text x="55" y="24">vive_fam</text><text x="150" y="24">alquiler</text>
    </g>
    <rect x="0" y="36" width="215" height="160" fill="#fff" stroke="#0f4c3a" stroke-width="2"/>
    <g font-family="Courier New, monospace" font-size="13" fill="#333">
      <text x="12" y="64">1</text><text x="55" y="64">TRUE</text><text x="150" y="64" fill="#1fa59a" font-weight="bold">NA</text>
      <text x="12" y="104">2</text><text x="55" y="104">FALSE</text><text x="150" y="104">12000</text>
      <text x="12" y="144">3</text><text x="55" y="144">TRUE</text><text x="150" y="144" fill="#1fa59a" font-weight="bold">NA</text>
      <text x="12" y="184">4</text><text x="55" y="184">FALSE</text><text x="150" y="184">9000</text>
    </g>
    <g stroke="#ddd"><line x1="0" y1="76" x2="215" y2="76"/><line x1="0" y1="116" x2="215" y2="116"/><line x1="0" y1="156" x2="215" y2="156"/></g>
  </g>
  <text x="767" y="285" text-anchor="middle" font-size="13" fill="#1fa59a" font-weight="bold">NA por diseño: faltante estructural</text>
  <text x="767" y="305" text-anchor="middle" font-size="12" fill="#666">no es que no quisieron responder</text>
</svg>
