<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g transform="translate(40,30)">
    <rect x="0" y="0" width="520" height="36" fill="#0f4c3a"/>
    <g fill="#fff" font-family="Courier New, monospace" font-size="13" font-weight="bold">
      <text x="12" y="24">id</text><text x="60" y="24">vive_fam</text><text x="160" y="24">alquiler</text>
      <text x="260" y="24">gasto_comida</text><text x="400" y="24">fuente_otro</text>
    </g>
    <rect x="0" y="36" width="520" height="164" fill="#fff" stroke="#0f4c3a" stroke-width="2"/>
    <g stroke="#ddd"><line x1="0" y1="77" x2="520" y2="77"/><line x1="0" y1="118" x2="520" y2="118"/><line x1="0" y1="159" x2="520" y2="159"/></g>
    <g font-family="Courier New, monospace" font-size="13" fill="#333">
      <text x="12" y="62">1</text><text x="60" y="62">TRUE</text><text x="160" y="62" fill="#0f4c3a" font-weight="bold">NA</text><text x="260" y="62">4500</text><text x="400" y="62" fill="#888" font-weight="bold">NA</text>
      <text x="12" y="103">2</text><text x="60" y="103">FALSE</text><text x="160" y="103">12000</text><text x="260" y="103">8200</text><text x="400" y="103" fill="#888" font-weight="bold">NA</text>
      <text x="12" y="144">3</text><text x="60" y="144">TRUE</text><text x="160" y="144" fill="#0f4c3a" font-weight="bold">NA</text><text x="260" y="144" fill="#1fa59a" font-weight="bold">NA</text><text x="400" y="144" fill="#888" font-weight="bold">NA</text>
      <text x="12" y="185">4</text><text x="60" y="185">FALSE</text><text x="160" y="185">9000</text><text x="260" y="185">6000</text><text x="400" y="185">freelance</text>
    </g>
  </g>
  <!-- leyenda -->
  <g transform="translate(600,50)" font-size="14">
    <rect x="0" y="0" width="22" height="22" fill="#0f4c3a"/>
    <text x="32" y="12" font-weight="bold" fill="#0f4c3a">Estructural</text>
    <text x="32" y="32" fill="#444">el filtro lo saltó; no debía responder</text>
    <rect x="0" y="70" width="22" height="22" fill="#1fa59a"/>
    <text x="32" y="82" font-weight="bold" fill="#1fa59a">No respuesta</text>
    <text x="32" y="102" fill="#444">debía responder y no lo hizo</text>
    <rect x="0" y="140" width="22" height="22" fill="#888"/>
    <text x="32" y="152" font-weight="bold" fill="#888">No aplica</text>
    <text x="32" y="172" fill="#444">no eligió "Otro"; el campo no le corresponde</text>
    <text x="0" y="215" font-size="13" fill="#666">Los tres se ven igual en la tabla.</text>
    <text x="0" y="235" font-size="13" fill="#666">Los distingue el libro de códigos.</text>
  </g>
</svg>
