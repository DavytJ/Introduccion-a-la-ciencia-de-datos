<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6faf8"/><stop offset="1" stop-color="#ecf5f1"/></linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b7a5e"/><stop offset="1" stop-color="#0f4c3a"/></linearGradient>
    <linearGradient id="nar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd6c4"/><stop offset="1" stop-color="#1fa59a"/></linearGradient>
    <linearGradient id="gris" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6aa79a"/><stop offset="1" stop-color="#3f7a6c"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f4c3a" flood-opacity="0.16"/></filter>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1fa59a"/></marker>
    <marker id="arrb" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#0f4c3a"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <g transform="translate(220,200)">
    <circle cx="0" cy="0" r="95" fill="#fff" stroke="#c4ddd4" stroke-width="2"/>
    <circle cx="0" cy="0" r="70" fill="#ecf5f1"/>
    <circle cx="0" cy="0" r="45" fill="#fff"/>
    <circle cx="0" cy="0" r="20" fill="#2e7d32"/>
    <g fill="#1fa59a"><circle cx="-6" cy="4" r="7"/><circle cx="5" cy="-5" r="7"/><circle cx="2" cy="8" r="7"/><circle cx="-4" cy="-7" r="7"/></g>
    <text x="0" y="135" text-anchor="middle" font-size="19" font-weight="700" fill="#0f4c3a">Válida y confiable</text>
  </g>
  <g transform="translate(600,200)">
    <circle cx="0" cy="0" r="95" fill="#fff" stroke="#c4ddd4" stroke-width="2"/>
    <circle cx="0" cy="0" r="70" fill="#ecf5f1"/>
    <circle cx="0" cy="0" r="45" fill="#fff"/>
    <circle cx="0" cy="0" r="20" fill="#0f4c3a"/>
    <g fill="#1fa59a"><circle cx="48" cy="-40" r="7"/><circle cx="56" cy="-30" r="7"/><circle cx="44" cy="-28" r="7"/><circle cx="54" cy="-42" r="7"/></g>
    <text x="0" y="135" text-anchor="middle" font-size="19" font-weight="700" fill="#0f4c3a">Confiable, no válida</text>
  </g>
  <g transform="translate(980,200)">
    <circle cx="0" cy="0" r="95" fill="#fff" stroke="#c4ddd4" stroke-width="2"/>
    <circle cx="0" cy="0" r="70" fill="#ecf5f1"/>
    <circle cx="0" cy="0" r="45" fill="#fff"/>
    <circle cx="0" cy="0" r="20" fill="#0f4c3a"/>
    <g fill="#1fa59a"><circle cx="-50" cy="30" r="7"/><circle cx="40" cy="-55" r="7"/><circle cx="20" cy="50" r="7"/><circle cx="-30" cy="-45" r="7"/></g>
    <text x="0" y="135" text-anchor="middle" font-size="19" font-weight="700" fill="#0f4c3a">Ni una ni otra</text>
  </g>
  <g font-size="15" fill="#556" text-anchor="middle">
    <text x="220" y="365">mide lo que dice medir,</text><text x="220" y="387">siempre igual</text>
    <text x="600" y="365">siempre igual,</text><text x="600" y="387">pero mide otra cosa</text>
    <text x="980" y="365">cada vez un resultado</text><text x="980" y="387">distinto</text>
  </g>
  <g font-size="15" font-style="italic" fill="#333" text-anchor="middle">
    <text x="600" y="425">«¿Está conforme con lo que gasta en comida y transporte?»</text>
    <text x="980" y="425">«¿Cuánto gasta en transporte?» (sin período)</text>
  </g>
  <rect x="270" y="470" width="660" height="52" rx="26" fill="#0f4c3a"/>
  <text x="600" y="503" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">La redacción de la pregunta decide en qué diana cae</text>
