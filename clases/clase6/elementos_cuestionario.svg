<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6faf8"/><stop offset="1" stop-color="#ecf5f1"/></linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b7a5e"/><stop offset="1" stop-color="#0f4c3a"/></linearGradient>
    <linearGradient id="nar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd6c4"/><stop offset="1" stop-color="#1fa59a"/></linearGradient>
    <linearGradient id="gris" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6aa79a"/><stop offset="1" stop-color="#3f7a6c"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f4c3a" flood-opacity="0.16"/></filter>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1fa59a"/></marker>
    <marker id="arrb" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#0f4c3a"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <!-- documento -->
  <g transform="translate(120,40)">
    <rect x="14" y="14" width="420" height="480" rx="14" fill="#d5e8e0"/>
    <rect x="0" y="0" width="420" height="480" rx="14" fill="#fff" filter="url(#sh)"/>
    <rect x="0" y="0" width="420" height="62" rx="14" fill="url(#azul)"/><rect x="0" y="44" width="420" height="18" fill="#0f4c3a"/>
    <text x="210" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1 · Título</text>
    <rect x="24" y="80" width="372" height="60" rx="8" fill="#ecf5f1"/><text x="40" y="103" font-size="14" font-weight="700" fill="#0f4c3a">2 · Introducción</text><text x="40" y="125" font-size="12" fill="#556">quién, para qué, cuánto lleva</text>
    <rect x="24" y="150" width="372" height="60" rx="8" fill="#e3f7f2"/><text x="40" y="173" font-size="14" font-weight="700" fill="#1fa59a">3 · Consentimiento</text><text x="40" y="195" font-size="12" fill="#556">finalidad y uso de los datos · Ley 18.331</text>
    <rect x="24" y="220" width="372" height="44" rx="8" fill="#ecf5f1"/><text x="40" y="247" font-size="14" font-weight="700" fill="#0f4c3a">4 · Instrucciones</text>
    <rect x="24" y="274" width="372" height="130" rx="8" fill="#fff" stroke="#c4ddd4" stroke-width="2"/>
    <text x="40" y="298" font-size="14" font-weight="700" fill="#0f4c3a">5 · Preguntas</text>
    <g fill="#c4ddd4"><rect x="40" y="312" width="300" height="9" rx="4"/><rect x="40" y="330" width="260" height="9" rx="4"/><rect x="40" y="348" width="320" height="9" rx="4"/><rect x="40" y="366" width="220" height="9" rx="4"/><rect x="40" y="384" width="290" height="9" rx="4"/></g>
    <rect x="24" y="414" width="372" height="44" rx="8" fill="#ecf5f1"/><text x="40" y="441" font-size="14" font-weight="700" fill="#0f4c3a">6 · Cierre y agradecimiento</text>
  </g>
  <!-- notas al costado -->
  <g font-size="16" fill="#333">
    <rect x="620" y="90" width="500" height="120" rx="16" fill="#fff" filter="url(#sh)"/>
    <rect x="620" y="90" width="12" height="120" rx="6" fill="#1fa59a"/>
    <text x="655" y="125" font-weight="700" fill="#0f4c3a">Las partes 2 y 3 no son decoración</text>
    <text x="655" y="155">Ahí se cumple el principio de finalidad y el</text>
    <text x="655" y="180">consentimiento informado. Sin ellas, los datos no se usan.</text>
    <rect x="620" y="250" width="500" height="120" rx="16" fill="#fff" filter="url(#sh)"/>
    <rect x="620" y="250" width="12" height="120" rx="6" fill="#0f4c3a"/>
    <text x="655" y="285" font-weight="700" fill="#0f4c3a">Esta clase trabaja en la parte 5</text>
    <text x="655" y="315">Pero el cuestionario que se entrega es el documento</text>
    <text x="655" y="340">completo, de la 1 a la 6.</text>
    <rect x="620" y="410" width="500" height="90" rx="16" fill="#0f4c3a"/>
    <text x="870" y="445" text-anchor="middle" font-size="16" fill="#fff">Una buena primera pregunta hace que la persona siga.</text>
    <text x="870" y="475" text-anchor="middle" font-size="16" fill="#5fd6c4">Las sensibles van al final.</text>
  </g>
</svg>
