<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f4c3a"/></marker></defs>
  <!-- pregunta -->
  <rect x="30" y="30" width="330" height="230" rx="10" fill="#fff" stroke="#0f4c3a" stroke-width="3"/>
  <text x="50" y="65" font-size="14" font-weight="bold" fill="#0f4c3a">P7. ¿En cuáles de estos rubros tuvo</text>
  <text x="50" y="85" font-size="14" font-weight="bold" fill="#0f4c3a">algún gasto? (marque todas)</text>
  <g font-size="14" fill="#333">
    <g fill="#fff" stroke="#666" stroke-width="1.5">
      <rect x="55" y="105" width="16" height="16"/><rect x="55" y="135" width="16" height="16"/><rect x="55" y="165" width="16" height="16"/>
      <rect x="55" y="195" width="16" height="16"/><rect x="55" y="225" width="16" height="16"/>
    </g>
    <path d="M58,113 l5,5 l8,-10 M58,143 l5,5 l8,-10 M58,203 l5,5 l8,-10" stroke="#1fa59a" stroke-width="2.5" fill="none"/>
    <text x="80" y="118">Materiales de estudio</text><text x="80" y="148">Salidas</text><text x="80" y="178">Ropa</text>
    <text x="80" y="208">Suscripciones digitales</text><text x="80" y="238">Salud</text>
  </g>
  <line x1="375" y1="145" x2="440" y2="145" stroke="#0f4c3a" stroke-width="3" marker-end="url(#a)"/>
  <!-- NO -->
  <g transform="translate(455,40)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#c0392b">NO: una columna de texto</text>
    <rect x="0" y="10" width="420" height="34" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="10" y="32" font-family="Courier New, monospace" font-size="12" fill="#333">rubros = "Materiales; Salidas; Suscripciones"</text>
    <text x="0" y="66" font-size="12" fill="#666">no se puede filtrar, contar ni cruzar sin volver a procesar</text>
  </g>
  <!-- SÍ -->
  <g transform="translate(455,130)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#2e7d32">SÍ: una columna binaria por opción</text>
    <rect x="0" y="10" width="420" height="36" fill="#0f4c3a"/>
    <g fill="#fff" font-family="Courier New, monospace" font-size="10.5" font-weight="bold">
      <text x="6" y="33">rubro_mat</text><text x="90" y="33">rubro_sal</text><text x="175" y="33">rubro_ropa</text>
      <text x="265" y="33">rubro_susc</text><text x="352" y="33">rubro_salud</text>
    </g>
    <rect x="0" y="46" width="420" height="40" fill="#fff" stroke="#0f4c3a" stroke-width="2"/>
    <g font-family="Courier New, monospace" font-size="15" font-weight="bold">
      <text x="30" y="73" fill="#1fa59a">1</text><text x="115" y="73" fill="#1fa59a">1</text><text x="205" y="73" fill="#999">0</text>
      <text x="295" y="73" fill="#1fa59a">1</text><text x="385" y="73" fill="#999">0</text>
    </g>
    <text x="0" y="112" font-size="12" fill="#666">cinco opciones, cinco columnas: cada una se cuenta y se cruza sola</text>
  </g>
</svg>
