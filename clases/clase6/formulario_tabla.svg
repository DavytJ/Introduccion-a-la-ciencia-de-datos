  </g>
  <!-- flecha -->
  <line x1="365" y1="180" x2="440" y2="180" stroke="#1a3a6e" stroke-width="4" marker-end="url(#arr)"/>
  <!-- tabla -->
  <g font-size="14">
    <rect x="465" y="100" width="400" height="160" fill="#fff" stroke="#1a3a6e" stroke-width="3"/>
    <rect x="465" y="100" width="400" height="36" fill="#1a3a6e"/>
    <g fill="#fff" font-weight="bold" font-family="Courier New, monospace" font-size="13">
