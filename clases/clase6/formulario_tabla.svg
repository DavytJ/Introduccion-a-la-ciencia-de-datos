<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1a3a6e"/>
    </marker>
  </defs>
  <!-- formulario -->
  <rect x="40" y="30" width="300" height="300" rx="10" fill="#fff" stroke="#1a3a6e" stroke-width="3"/>
  <rect x="40" y="30" width="300" height="44" rx="10" fill="#1a3a6e"/>
  <text x="190" y="59" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">Cuestionario</text>
  <g font-size="15" fill="#333">
    <text x="60" y="110">P1. ¿En qué año está?</text>
    <g fill="#fff" stroke="#666" stroke-width="1.5">
