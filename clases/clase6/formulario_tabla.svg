    </g>
    <path d="M128,129 l4,5 l7,-9" stroke="#e07a00" stroke-width="2.5" fill="none"/>
    <text x="88" y="134" font-size="12">1.º</text><text x="143" y="134" font-size="12">2.º</text>
    <text x="198" y="134" font-size="12">3.º</text><text x="253" y="134" font-size="12">4.º</text>
    <text x="60" y="172">P2. ¿Vive en casa familiar?</text>
    <g fill="#fff" stroke="#666" stroke-width="1.5"><rect x="70" y="184" width="14" height="14"/><rect x="130" y="184" width="14" height="14"/></g>
    <path d="M73,191 l4,5 l7,-9" stroke="#e07a00" stroke-width="2.5" fill="none"/>
    <text x="88" y="196" font-size="12">Sí</text><text x="148" y="196" font-size="12">No</text>
    <text x="60" y="234">P5. Gasto en comida, 30 días</text>
    <rect x="70" y="244" width="120" height="24" fill="#fff" stroke="#666" stroke-width="1.5"/>
    <text x="78" y="261" font-size="13" fill="#e07a00">$ 4500</text>
    <text x="60" y="300">P7. Rubros (marque todas)</text>
    <g fill="#fff" stroke="#666" stroke-width="1.5">
      <rect x="70" y="308" width="14" height="14"/><rect x="150" y="308" width="14" height="14"/><rect x="230" y="308" width="14" height="14"/>
    </g>
    <path d="M73,315 l4,5 l7,-9" stroke="#e07a00" stroke-width="2.5" fill="none"/>
    <path d="M233,315 l4,5 l7,-9" stroke="#e07a00" stroke-width="2.5" fill="none"/>
