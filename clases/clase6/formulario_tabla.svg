    </g>
    <g fill="#333" font-family="Courier New, monospace" font-size="13">
      <text x="480" y="162" fill="#e07a00" font-weight="bold">1</text><text x="520" y="162" fill="#e07a00" font-weight="bold">2</text>
      <text x="580" y="162" fill="#e07a00" font-weight="bold">TRUE</text><text x="670" y="162" fill="#e07a00" font-weight="bold">4500</text><text x="770" y="162" fill="#e07a00" font-weight="bold">1</text>
      <text x="480" y="203">2</text><text x="520" y="203">4</text><text x="580" y="203">FALSE</text><text x="670" y="203">8200</text><text x="770" y="203">0</text>
      <text x="480" y="244">3</text><text x="520" y="244">1</text><text x="580" y="244">TRUE</text><text x="670" y="244" fill="#999">NA</text><text x="770" y="244">1</text>
    </g>
    <text x="665" y="290" text-anchor="middle" fill="#1a3a6e" font-size="15">una fila por respondente · una columna por variable</text>
