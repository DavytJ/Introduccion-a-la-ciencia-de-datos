<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- declaradas -->
  <g transform="translate(60,30)">
    <path d="M20,20 h200 a12,12 0 0 1 12,12 v90 a12,12 0 0 1 -12,12 h-120 l-30,30 v-30 h-50 a12,12 0 0 1 -12,-12 v-90 a12,12 0 0 1 12,-12 z" fill="#ecf5f1" stroke="#0f4c3a" stroke-width="3"/>
    <text x="126" y="60" text-anchor="middle" font-size="15" fill="#333">«Gasté unos</text>
    <text x="126" y="84" text-anchor="middle" font-size="15" fill="#333">$4.500 en comida»</text>
    <text x="126" y="112" text-anchor="middle" font-size="13" fill="#666">(cree recordar)</text>
    <text x="126" y="215" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f4c3a">Declaradas</text>
    <text x="126" y="240" text-anchor="middle" font-size="14" fill="#333">lo que la persona dice</text>
    <text x="126" y="262" text-anchor="middle" font-size="14" fill="#333">encuesta</text>
  </g>
  <!-- reveladas: ticket -->
  <g transform="translate(340,30)">
    <path d="M40,10 h170 v150 l-12,-10 l-12,10 l-12,-10 l-12,10 l-12,-10 l-12,10 l-12,-10 l-12,10 l-12,-10 l-12,10 l-12,-10 l-12,10 l-12,-10 l-12,10 z" fill="#fff" stroke="#0f4c3a" stroke-width="3"/>
    <g font-family="Courier New, monospace" font-size="12" fill="#333">
      <text x="125" y="38" text-anchor="middle" font-weight="bold">CAFETERÍA</text>
      <text x="55" y="62">03/09 café</text><text x="195" y="62" text-anchor="end">120</text>
      <text x="55" y="80">05/09 almuerzo</text><text x="195" y="80" text-anchor="end">380</text>
      <text x="55" y="98">09/09 café</text><text x="195" y="98" text-anchor="end">120</text>
      <text x="55" y="116">…</text>
      <text x="55" y="138" font-weight="bold">TOTAL 30 d</text><text x="195" y="138" text-anchor="end" font-weight="bold" fill="#1fa59a">5.210</text>
    </g>
    <text x="126" y="215" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f4c3a">Reveladas</text>
    <text x="126" y="240" text-anchor="middle" font-size="14" fill="#333">lo que la persona hace</text>
    <text x="126" y="262" text-anchor="middle" font-size="14" fill="#333">transacciones, registros</text>
  </g>
  <!-- huella: teléfono -->
  <g transform="translate(620,30)">
    <rect x="80" y="5" width="92" height="165" rx="14" fill="#fff" stroke="#0f4c3a" stroke-width="3"/>
    <rect x="88" y="20" width="76" height="130" rx="4" fill="#ecf5f1"/>
    <circle cx="126" cy="160" r="5" fill="#0f4c3a"/>
    <g font-family="Courier New, monospace" font-size="9" fill="#555">
      <text x="93" y="36">12:01 open</text>
      <text x="93" y="50">12:02 tap menú</text>
      <text x="93" y="64">12:02 scroll</text>
      <text x="93" y="78">12:04 add item</text>
      <text x="93" y="92">12:05 geo -34.9</text>
      <text x="93" y="106">12:05 pay 380</text>
      <text x="93" y="120">12:06 close</text>
      <text x="93" y="134">…</text>
    </g>
    <text x="126" y="215" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f4c3a">Huella digital</text>
    <text x="126" y="240" text-anchor="middle" font-size="14" fill="#333">lo que el sistema registra</text>
    <text x="126" y="262" text-anchor="middle" font-size="14" fill="#333">logs, clics, ubicación</text>
  </g>
  <text x="450" y="330" text-anchor="middle" font-size="15" fill="#666">tres fuentes · tres columnas «gasto_comida» que no significan lo mismo</text>
