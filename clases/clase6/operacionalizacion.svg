<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef2f8"/></linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a56a8"/><stop offset="1" stop-color="#1a3a6e"/></linearGradient>
    <linearGradient id="nar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f39a2b"/><stop offset="1" stop-color="#e07a00"/></linearGradient>
    <linearGradient id="gris" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a8aa6"/><stop offset="1" stop-color="#4f5f7d"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1a3a6e" flood-opacity="0.16"/></filter>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#e07a00"/></marker>
    <marker id="arrb" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1a3a6e"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <!-- cadena -->
  <g font-size="20" font-weight="700" text-anchor="middle">
    <rect x="40" y="60" width="200" height="70" rx="35" fill="url(#azul)" filter="url(#sh)"/><text x="140" y="103" fill="#fff">Concepto</text>
    <rect x="280" y="60" width="200" height="70" rx="35" fill="#2f5aa8" filter="url(#sh)"/><text x="380" y="103" fill="#fff">Dimensión</text>
    <rect x="520" y="60" width="200" height="70" rx="35" fill="#4a72b8" filter="url(#sh)"/><text x="620" y="103" fill="#fff">Indicador</text>
    <rect x="760" y="60" width="200" height="70" rx="35" fill="url(#nar)" filter="url(#sh)"/><text x="860" y="103" fill="#fff">Pregunta</text>
    <rect x="1000" y="60" width="160" height="70" rx="35" fill="#fff" stroke="#1a3a6e" stroke-width="3" filter="url(#sh)"/><text x="1080" y="103" fill="#1a3a6e" font-family="Courier New, monospace">columna</text>
  </g>
  <g stroke="#e07a00" stroke-width="4" stroke-linecap="round">
    <line x1="245" y1="95" x2="272" y2="95" marker-end="url(#arr)"/><line x1="485" y1="95" x2="512" y2="95" marker-end="url(#arr)"/>
    <line x1="725" y1="95" x2="752" y2="95" marker-end="url(#arr)"/><line x1="965" y1="95" x2="992" y2="95" marker-end="url(#arr)"/>
  </g>
  <!-- ejemplo: árbol -->
  <g font-size="17">
    <rect x="40" y="215" width="200" height="110" rx="14" fill="#fff" filter="url(#sh)"/>
    <text x="140" y="260" text-anchor="middle" font-weight="700" fill="#1a3a6e">Situación</text><text x="140" y="285" text-anchor="middle" font-weight="700" fill="#1a3a6e">económica</text>
    <!-- dimensiones -->
    <rect x="280" y="170" width="200" height="70" rx="12" fill="#fff" filter="url(#sh)"/>
    <text x="380" y="200" text-anchor="middle" fill="#333">Percepción</text><text x="380" y="222" text-anchor="middle" fill="#333">subjetiva</text>
    <rect x="280" y="300" width="200" height="70" rx="12" fill="#fff" filter="url(#sh)"/>
    <text x="380" y="330" text-anchor="middle" fill="#333">Gasto</text><text x="380" y="352" text-anchor="middle" fill="#333">efectivo</text>
    <!-- indicadores -->
    <rect x="520" y="150" width="200" height="56" rx="12" fill="#fff" filter="url(#sh)"/><text x="620" y="184" text-anchor="middle" fill="#333">Autoevaluación 1–5</text>
    <rect x="520" y="270" width="200" height="56" rx="12" fill="#fff" filter="url(#sh)"/><text x="620" y="304" text-anchor="middle" fill="#333">Comida, 30 días</text>
    <rect x="520" y="340" width="200" height="56" rx="12" fill="#fff" filter="url(#sh)"/><text x="620" y="374" text-anchor="middle" fill="#333">Transporte, 30 días</text>
    <!-- preguntas -->
    <g font-weight="700" fill="#e07a00" text-anchor="middle">
      <rect x="790" y="150" width="140" height="56" rx="28" fill="#fdf1e3"/><text x="860" y="184">P10</text>
      <rect x="790" y="270" width="140" height="56" rx="28" fill="#fdf1e3"/><text x="860" y="304">P5</text>
      <rect x="790" y="340" width="140" height="56" rx="28" fill="#fdf1e3"/><text x="860" y="374">P6</text>
    </g>
    <!-- columnas -->
    <g font-family="Courier New, monospace" fill="#1a3a6e" font-weight="700">
      <text x="990" y="184">situacion</text><text x="990" y="304">gasto_comida</text><text x="990" y="374">gasto_transporte</text>
    </g>
  </g>
  <g fill="none" stroke="#9fb0cc" stroke-width="2.5">
    <path d="M240,270 C260,270 260,205 280,205"/><path d="M240,270 C260,270 260,335 280,335"/>
    <path d="M480,205 C500,205 500,178 520,178"/>
    <path d="M480,335 C500,335 500,298 520,298"/><path d="M480,335 C500,335 500,368 520,368"/>
    <line x1="720" y1="178" x2="790" y2="178"/><line x1="720" y1="298" x2="790" y2="298"/><line x1="720" y1="368" x2="790" y2="368"/>
    <line x1="930" y1="178" x2="985" y2="178"/><line x1="930" y1="298" x2="985" y2="298"/><line x1="930" y1="368" x2="985" y2="368"/>
  </g>
  <rect x="240" y="470" width="720" height="52" rx="26" fill="#1a3a6e"/>
  <text x="600" y="503" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Un concepto necesita varias columnas; una columna nunca es el concepto</text>
</svg>
