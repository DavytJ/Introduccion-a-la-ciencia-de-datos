<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6faf8"/><stop offset="1" stop-color="#ecf5f1"/></linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b7a5e"/><stop offset="1" stop-color="#0f4c3a"/></linearGradient>
    <linearGradient id="nar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd6c4"/><stop offset="1" stop-color="#1fa59a"/></linearGradient>
    <linearGradient id="gris" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6aa79a"/><stop offset="1" stop-color="#3f7a6c"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f4c3a" flood-opacity="0.16"/></filter>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1fa59a"/></marker>
    <marker id="arrb" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#0f4c3a"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <!-- NO -->
  <g transform="translate(0,40)">
    <rect x="60" y="0" width="1080" height="180" rx="18" fill="#fff" filter="url(#sh)"/>
    <rect x="60" y="0" width="12" height="180" rx="6" fill="#c0392b"/>
    <text x="100" y="40" font-size="20" font-weight="700" fill="#c0392b">Desequilibrada</text>
    <text x="270" y="40" font-size="16" fill="#556">una opción negativa, cuatro positivas: empuja hacia arriba</text>
    <line x1="140" y1="105" x2="1060" y2="105" stroke="#c4ddd4" stroke-width="4"/>
    <g font-size="14" text-anchor="middle">
      <circle cx="200" cy="105" r="16" fill="#c0392b"/><text x="200" y="111" fill="#fff" font-weight="700">1</text><text x="200" y="150" fill="#333">Nada importante</text>
      <circle cx="400" cy="105" r="16" fill="#1fa59a"/><text x="400" y="111" fill="#fff" font-weight="700">2</text><text x="400" y="150" fill="#333">Algo importante</text>
      <circle cx="600" cy="105" r="16" fill="#1fa59a"/><text x="600" y="111" fill="#fff" font-weight="700">3</text><text x="600" y="150" fill="#333">Importante</text>
      <circle cx="800" cy="105" r="16" fill="#1fa59a"/><text x="800" y="111" fill="#fff" font-weight="700">4</text><text x="800" y="150" fill="#333">Muy importante</text>
      <circle cx="1000" cy="105" r="16" fill="#1fa59a"/><text x="1000" y="111" fill="#fff" font-weight="700">5</text><text x="1000" y="150" fill="#333">Extremadamente</text>
    </g>
  </g>
  <!-- SÍ -->
  <g transform="translate(0,255)">
    <rect x="60" y="0" width="1080" height="240" rx="18" fill="#fff" filter="url(#sh)"/>
    <rect x="60" y="0" width="12" height="240" rx="6" fill="#2e7d32"/>
    <text x="100" y="40" font-size="20" font-weight="700" fill="#2e7d32">Equilibrada y ordenada</text>
    <text x="360" y="40" font-size="16" fill="#556">dos y dos, de negativo a positivo, etiquetas en todos los puntos</text>
    <line x1="140" y1="105" x2="820" y2="105" stroke="#c4ddd4" stroke-width="4"/>
    <g font-size="14" text-anchor="middle">
      <circle cx="200" cy="105" r="16" fill="#c0392b"/><text x="200" y="111" fill="#fff" font-weight="700">1</text><text x="200" y="150" fill="#333">Nada importante</text>
      <circle cx="400" cy="105" r="16" fill="#8ed3c4"/><text x="400" y="111" fill="#fff" font-weight="700">2</text><text x="400" y="150" fill="#333">Poco importante</text>
      <circle cx="600" cy="105" r="16" fill="#5fbf9e"/><text x="600" y="111" fill="#fff" font-weight="700">3</text><text x="600" y="150" fill="#333">Algo importante</text>
      <circle cx="800" cy="105" r="16" fill="#2e7d32"/><text x="800" y="111" fill="#fff" font-weight="700">4</text><text x="800" y="150" fill="#333">Muy importante</text>
    </g>
    <!-- separador y no aplica -->
    <line x1="890" y1="70" x2="890" y2="170" stroke="#9fc9bb" stroke-width="2" stroke-dasharray="6,5"/>
    <g font-size="14" text-anchor="middle">
      <circle cx="1000" cy="105" r="16" fill="#fff" stroke="#6aa79a" stroke-width="3"/><text x="1000" y="150" fill="#556">No aplica</text>
      <text x="1000" y="172" fill="#6aa79a" font-size="12">fuera de la escala</text>
    </g>
    <text x="510" y="215" text-anchor="middle" font-size="15" fill="#556">La misma dirección en todo el cuestionario: mayor valor, mejor</text>
  </g>
</svg>
